name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.20"
          # Cache ~/.cache/uv between runs. Invalidates only when uv.lock
          # changes, so source-only PRs reuse the wheel cache entirely.
          # The action handles save-and-restore for you - no actions/cache
          # boilerplate needed.
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.20"
          # Cache ~/.cache/uv between runs. Invalidates only when uv.lock
          # changes, so source-only PRs reuse the wheel cache entirely.
          # The action handles save-and-restore for you - no actions/cache
          # boilerplate needed.
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen
      - run: |
          uv run pytest \
            --cov=cv_pipeline \
            --cov=api \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=85 \
            -m unit \
            -v
        env:
          API_KEY: ci-test-key
      - uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npx eslint src/
      - run: npm run test:ci
      - run: npm run build
